name: CI Build & Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-frontend-and-sdk:
    name: Verify TypeScript Frontend & SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Audit npm dependencies
        # pnpm-workspace.yaml's auditConfig.ignoreGhsas lists the specific,
        # already-triaged advisories this ignores (the next 14->15 and toml
        # 3->5 upgrades, plus a dompurify patch held for the next lockfile
        # refresh) and why. Any new high/critical advisory not on that list
        # fails the build.
        run: pnpm audit --audit-level=high

      # Keep these contract IDs in sync with the "Run E2E Tests" step below.
      # They are scoped to the build steps on purpose: the SDK's defaults read
      # them from the environment, and its unit tests expect them unset.
      - name: Build Packages (SDK & Web App)
        run: pnpm build
        env:
          NEXT_PUBLIC_REGISTRY_CONTRACT_ID: CABGWVIZFF62FG67ZGFEP67NEEY4WYTMFURDMFTKKNRDAFPKPOJDTN4C
          NEXT_PUBLIC_INVOICE_CONTRACT_ID: CA4O3MR7LWHRSUDBNU6FY6UDFFYBN7TGBZXBDZB4OYYXFYXIFJ6RJF6B
          NEXT_PUBLIC_POOL_CONTRACT_ID: CAKEWH7SJCXGV2MH2WZYIX3QDPTSSBQFXYVYBOWAGLNBBZMPLE2US6CS
          NEXT_PUBLIC_ESCROW_CONTRACT_ID: CAJWGUKDTTC3SKN4RAAY72J4DVIIYSCFHX6GIMNTT22ABMISJK4GBCEH

      - name: Run Unit Tests
        run: pnpm test

      - name: Lint SDK
        run: pnpm --filter @trusttrove/sdk lint
      - name: SDK coverage (with thresholds)
        run: pnpm --filter @trusttrove/sdk test:coverage

      - name: Upload SDK coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-coverage-report
          path: |
            packages/sdk/coverage
            packages/sdk/coverage/lcov.info
          if-no-files-found: warn

      - name: Lint Web Application
        run: pnpm --filter web lint

      - name: Check Formatting
        run: pnpm format:check

  e2e-web:
    name: Web E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # web imports @trusttrove/sdk from its dist/ output.
      - name: Build SDK
        run: pnpm --filter @trusttrove/sdk build

      - name: Resolve Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-chromium

      # Always run: --with-deps installs the OS libraries, which are not cached;
      # the browser download itself is skipped on a cache hit.
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts builds the app and serves it with `next start`
      # when CI is set. NEXT_PUBLIC_* values are inlined at build time, so these
      # must match the "Build Packages (SDK & Web App)" step above.
      - name: Run E2E Tests
        run: pnpm test:e2e
        env:
          CI: true
          NEXT_PUBLIC_REGISTRY_CONTRACT_ID: CABGWVIZFF62FG67ZGFEP67NEEY4WYTMFURDMFTKKNRDAFPKPOJDTN4C
          NEXT_PUBLIC_INVOICE_CONTRACT_ID: CA4O3MR7LWHRSUDBNU6FY6UDFFYBN7TGBZXBDZB4OYYXFYXIFJ6RJF6B
          NEXT_PUBLIC_POOL_CONTRACT_ID: CAKEWH7SJCXGV2MH2WZYIX3QDPTSSBQFXYVYBOWAGLNBBZMPLE2US6CS
          NEXT_PUBLIC_ESCROW_CONTRACT_ID: CAJWGUKDTTC3SKN4RAAY72J4DVIIYSCFHX6GIMNTT22ABMISJK4GBCEH

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
          if-no-files-found: warn

  verify-go-indexer:
    name: Verify Go Indexer & API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trusttrove_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"

      - name: Get Dependencies
        run: |
          cd indexer
          go mod download

      - name: Compile Go Services
        run: |
          cd indexer
          go build -v ./...

      - name: Test Go Services
        run: |
          cd indexer
          go test -race -v -coverprofile=coverage.out ./...
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trusttrove_test?sslmode=disable
          INDEXER_MIGRATIONS_DIR: ${{ github.workspace }}/indexer/db/migrations

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          version: v1.64.5
          install-mode: goinstall
          working-directory: indexer
          args: --timeout=5m

      - name: Enforce indexer/db coverage threshold
        run: |
          cd indexer
          go test -covermode=atomic -coverprofile=db-coverage.out ./db/... \
            | tee /dev/stderr \
            | grep -oE 'coverage: [0-9.]+% of statements' \
            | grep -oE '[0-9.]+' \
            > /tmp/db_coverage_pct.txt
          pct=$(cat /tmp/db_coverage_pct.txt)
          echo "indexer/db statement coverage: ${pct}%"
          awk -v pct="$pct" 'BEGIN { exit !(pct >= 70) }' \
            || (echo "indexer/db coverage ${pct}% is below the required 70% threshold" && exit 1)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trusttrove_test?sslmode=disable
          INDEXER_MIGRATIONS_DIR: ${{ github.workspace }}/indexer/db/migrations

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd indexer
          govulncheck ./...

      - name: Lint Go Services
        run: |
          cd indexer
          go vet ./...

      - name: Check Go Formatting
        run: |
          cd indexer
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi
