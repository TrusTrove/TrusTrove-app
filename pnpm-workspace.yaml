    - GHSA-mrhx-c7xc-m3w5
    # Next 14.2.35 image optimization is mitigated by patched Sharp; Server
    # Actions are not used. Reassess both advisories with the Next 15 upgrade.
    - GHSA-2464-fhr4-w9xw
    # The app defines no Server Actions; the advisory states these apps are unaffected.
    - GHSA-p3m5-59mp-jv5r
    # braces is build-time only; no patched release is available yet.
    - GHSA-vfj7-8cjw-p6xm
