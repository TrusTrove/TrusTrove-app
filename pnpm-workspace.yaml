packages:
  - apps/*
  - packages/*
  - examples/*
allowBuilds:
  esbuild: false
  unrs-resolver: true
auditConfig:
  ignoreGhsas:
    - GHSA-p293-qw3h-jr36
    - GHSA-2xp9-vwfh-vxw4
    - GHSA-h25m-26qc-wcjf
    - GHSA-q4gf-8mx6-v5v3
    - GHSA-8h8q-6873-q5fj
    - GHSA-c4j6-fc7j-m34r
    - GHSA-36qx-fr4f-26g5
