    - GHSA-89xv-2m56-2m9x
    - GHSA-p9j2-gv94-2wf4
    - GHSA-82x6-q7mm-w9cf
    - GHSA-v5mp-jgw5-2x6j
    - GHSA-c29m-xwm3-cm6r
    - GHSA-mghh-pgcx-3jjj
    - GHSA-3pq3-5fj3-cg6v
